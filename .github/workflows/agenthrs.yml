name: agenthrs desk

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Hub issue number to run
        required: true
      command:
        description: start, continue, new, queue, stop, hold
        default: start
        required: false

concurrency:
  group: agenthrs-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  agenthrs:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        !github.event.issue.pull_request &&
        (github.event.action != 'labeled' || (github.event.label.name != 'queuedhrs' && github.event.label.name != 'runninghrs' && github.event.label.name != 'donehrs' && github.event.label.name != 'holdhrs' && github.event.label.name != 'blockedhrs')) &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.event.comment.user.type != 'Bot' &&
            !contains(github.event.comment.body, '<!-- agenthrs-bot -->')
          )
        )
      )
    runs-on: [self-hosted, Windows, agentdesk]
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run agenthrs on agentdesk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTHRS_GITHUB_TOKEN: ${{ secrets.AGENTHRS_GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: powershell
        run: powershell -NoProfile -File .github/scripts/agenthrs.ps1
